          BLOK_EOF
          mkdir -p app/src/main/java/com/blok/yardimci
          cat > app/src/main/java/com/blok/yardimci/Analyzer.kt <<'BLOK_EOF'
          package com.blok.yardimci

          import java.nio.ByteBuffer
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt

          class Frame(
              private val buf: ByteBuffer,
              private val rs: Int,
              private val ps: Int,
              val w: Int,
              val h: Int
          ) {
              fun r(x: Int, y: Int): Int = buf.get(y * rs + x * ps).toInt() and 0xFF
              fun g(x: Int, y: Int): Int = buf.get(y * rs + x * ps + 1).toInt() and 0xFF
              fun b(x: Int, y: Int): Int = buf.get(y * rs + x * ps + 2).toInt() and 0xFF
          }

          /**
           * Ekran görüntüsünden 8x8 tahtayı ve alttaki 3 parçayı okur.
           * Koordinatlar 1080 piksel genişlikteki referans yerleşime göredir, ekrana oranlanır.
           */
          class Analyzer {
              companion object {
                  const val P = 118.6
                  const val CX0 = 125.0
                  const val CY0 = 975.0
              }

              var dx = 0.0
              var dy = 0.0
              var s = 1.0
              private var qCount = 0
              private lateinit var f: Frame
              private val tmp = IntArray(3)

              private fun cx(c: Int) = (CX0 + dx + P * c) * s
              private fun cy(r: Int) = (CY0 + dy + P * r) * s

              private fun avg(x: Double, y: Double, rad: Int): IntArray {
                  var rr = 0
                  var gg = 0
                  var bb = 0
                  var n = 0
                  var j = -rad
                  while (j <= rad) {
                      var i = -rad
                      while (i <= rad) {
                          val xx = min(f.w - 1, max(0, (x + i).roundToInt()))
                          val yy = min(f.h - 1, max(0, (y + j).roundToInt()))
                          rr += f.r(xx, yy)
                          gg += f.g(xx, yy)
                          bb += f.b(xx, yy)
                          n++
                          i += 2
                      }
                      j += 2
                  }
                  tmp[0] = rr / n
                  tmp[1] = gg / n
                  tmp[2] = bb / n
                  return tmp
              }

              private fun mx(c: IntArray): Int = max(c[0], max(c[1], c[2]))

              private fun filled(c: IntArray): Boolean {
                  val m = mx(c)
                  val n = min(c[0], min(c[1], c[2]))
                  return m / 255.0 > 0.58 && (m - n).toDouble() / m > 0.3
              }

              private fun bright(x: Int, y: Int): Boolean {
                  if (x < 0 || y < 0 || x >= f.w || y >= f.h) return false
                  val r = f.r(x, y)
                  val g = f.g(x, y)
                  val b = f.b(x, y)
                  val m = max(r, max(g, b))
                  val n = min(r, min(g, b))
                  return m > 153 && (m - n).toDouble() / m > 0.4
              }

              /** Izgara doğru hizalıysa yüksek değer verir; qCount = belirgin hücre sayısı (64 üzerinden). */
              private fun quality(): Double {
                  var sum = 0.0
                  var cnt = 0
                  val half = P * s / 2
                  for (r in 0..7) {
                      for (c in 0..7) {
                          val x = cx(c)
                          val y = cy(r)
                          val m = mx(avg(x, y, 2))
                          val gv = mx(avg(x, if (r < 7) y + half else y - half, 1))
                          val gh = mx(avg(if (c < 7) x + half else x - half, y, 1))
                          val d = m - max(gv, gh)
                          if (d > 25) cnt++
                          sum += d.coerceIn(-30, 60)
                      }
                  }
                  qCount = cnt
                  return sum
              }

              private fun fit(): Boolean {
                  var bx = 0.0
                  var by = 0.0
                  var bs = -1e18
                  var a = -40
                  while (a <= 40) {
                      var b = -250
                      while (b <= 250) {
                          dx = a.toDouble()
                          dy = b.toDouble()
                          val q = quality()
                          if (q > bs) {
                              bs = q
                              bx = dx
                              by = dy
                          }
                          b += 6
                      }
                      a += 6
                  }
                  val cx0 = bx
                  val cy0 = by
                  bs = -1e18
                  for (a2 in -5..5) {
                      for (b2 in -5..5) {
                          dx = cx0 + a2
                          dy = cy0 + b2
                          val q = quality()
                          if (q > bs) {
                              bs = q
                              bx = dx
                              by = dy
                          }
                      }
                  }
                  dx = bx
                  dy = by
                  quality()
                  return qCount >= 58
              }

              /** [start, end] aralıklarını döner: eşiği geçen ardışık bölgeler, kısa boşluklar birleştirilir, kısa bölgeler atılır. */
              private fun segments(v: IntArray, thr: Int, gapMin: Int, lenMin: Int): List<IntArray> {
                  val out = ArrayList<IntArray>()
                  var st = -1
                  var last = -1
                  for (k in v.indices) {
                      if (v[k] >= thr) {
                          if (st < 0) st = k
                          last = k
                      } else if (st >= 0 && k - last >= gapMin) {
                          out.add(intArrayOf(st, last))
                          st = -1
                      }
                  }
                  if (st >= 0) out.add(intArrayOf(st, last))
                  return out.filter { it[1] - it[0] + 1 >= lenMin }
              }

              /**
               * Tepsideki bir parçayı okur. Hücre boyutunu tahmin etmez: parlak piksellerin
               * sütun ve satır izdüşümlerindeki boşluklardan hücre sınırlarını bulur.
               * Hızlı olması için her iki yönde de 2 pikselde bir örnekler.
               */
              private fun readPiece(i: Int): Piece? {
                  val x0 = ((85 + 315 * i + dx) * s).roundToInt().coerceAtLeast(0)
                  val x1 = min(f.w, (x0 + 283 * s).roundToInt())
                  val y0 = ((CY0 + dy + 950) * s).roundToInt().coerceAtLeast(0)
                  val y1 = min(f.h, ((CY0 + dy + 1152) * s).roundToInt())
                  val nx = (x1 - x0) / 2
                  val ny = (y1 - y0) / 2
                  if (nx < 10 || ny < 10) return null
                  val colCnt = IntArray(nx)
                  val rowCnt = IntArray(ny)
                  for (ky in 0 until ny) {
                      val y = y0 + ky * 2
                      for (kx in 0 until nx) {
                          if (bright(x0 + kx * 2, y)) {
                              colCnt[kx]++
                              rowCnt[ky]++
                          }
                      }
                  }
                  val gapMin = max(2, (3 * s).roundToInt())
                  val lenMin = max(6, (10 * s).roundToInt())
                  val cs = segments(colCnt, max(2, (3 * s).roundToInt()), gapMin, lenMin)
                  val rs = segments(rowCnt, max(5, (10 * s).roundToInt()), gapMin, lenMin)
                  if (cs.isEmpty() || rs.isEmpty() || cs.size > 5 || rs.size > 5) return null
                  val rows = IntArray(rs.size)
                  var any = false
                  val bcx = x0 + (cs[0][0] + cs[cs.size - 1][1]).toDouble()
                  val bcy = y0 + (rs[0][0] + rs[rs.size - 1][1]).toDouble()
                  var bestD = 1e18
                  var gi = 0
                  var gj = 0
                  var gx = bcx
                  var gy = bcy
                  for (ri in rs.indices) {
                      for (ci in cs.indices) {
                          val cxp = x0 + (cs[ci][0] + cs[ci][1]).toDouble()
                          val cyp = y0 + (rs[ri][0] + rs[ri][1]).toDouble()
                          if (filled(avg(cxp, cyp, max(2, (5 * s).roundToInt())))) {
                              rows[ri] = rows[ri] or (1 shl ci)
                              any = true
                              val d = (cxp - bcx) * (cxp - bcx) + (cyp - bcy) * (cyp - bcy)
                              if (d < bestD) {
                                  bestD = d
                                  gi = ri
                                  gj = ci
                                  gx = cxp
                                  gy = cyp
                              }
                          }
                      }
                  }
                  if (!any) return null
                  return Piece(i, rs.size, cs.size, rows, gx, gy, gi, gj)
              }

              private fun q(x: Int, y: Int): Long {
                  val xx = min(f.w - 1, max(0, x))
                  val yy = min(f.h - 1, max(0, y))
                  return (((f.r(xx, yy) shr 4) shl 8) or ((f.g(xx, yy) shr 4) shl 4) or (f.b(xx, yy) shr 4)).toLong()
              }

              /** Tahta hücre merkezlerinden ve tepsiden seyrek örnek alıp özet üretir. Ekran değişmediyse aynı çıkar. */
              fun quickHash(frame: Frame): Long {
                  f = frame
                  s = frame.w / 1080.0
                  var hsh = -3750763034362895579L
                  for (r in 0..7) {
                      for (c in 0..7) {
                          hsh = (hsh xor q(cx(c).roundToInt(), cy(r).roundToInt())) * 1099511628211L
                      }
                  }
                  val step = max(6, (14 * s).roundToInt())
                  for (i in 0..2) {
                      val x0 = ((85 + 315 * i + dx) * s).roundToInt()
                      val x1 = (x0 + 283 * s).roundToInt()
                      val y0 = ((CY0 + dy + 950) * s).roundToInt()
                      val y1 = ((CY0 + dy + 1152) * s).roundToInt()
                      var y = y0
                      while (y < y1) {
                          var x = x0
                          while (x < x1) {
                              hsh = (hsh xor q(x, y)) * 1099511628211L
                              x += step
                          }
                          y += step
                      }
                  }
                  return hsh
              }

              /** [segs] içinden toplam yoğunluğu en büyük olan aralığı seçer (tek tük gürültü pikselleri elenir). */
              private fun bestSeg(v: IntArray, segs: List<IntArray>): IntArray? {
                  var b: IntArray? = null
                  var bs = -1
                  for (g in segs) {
                      var t = 0
                      for (k in g[0]..g[1]) t += v[k]
                      if (t > bs) {
                          bs = t
                          b = g
                      }
                  }
                  return b
              }

              /**
               * Sürükleme sırasında ELDEKİ (kalkmış) parçanın ekrandaki gerçek yerini bulur.
               * Sürükleme öncesi kareyle (ref) farklı olan parlak pikselleri tahta bölgesinde toplar,
               * bunların sınır kutusunun merkezini parçanın merkezi sayar ve hamlenin hedef merkezine olan
               * farkı (px) döner: [ex, ey]. Parmak bu kadar kaydırılırsa parça tam hedef hücrelere oturur.
               * Parça bulunamazsa ya da boyutu tutmazsa null döner.
               */
              fun liftedError(frame: Frame, ref: Frame, p: Piece, m: Move): DoubleArray? {
                  f = frame
                  s = frame.w / 1080.0
                  val y0 = max(0, (cy(0) - P * s / 2 - 450 * s).roundToInt())
                  val y1 = min(frame.h, (cy(7) + P * s / 2 + 40 * s).roundToInt())
                  val step = max(2, (3 * s).roundToInt())
                  val nx = frame.w / step
                  val ny = (y1 - y0) / step
                  if (nx < 10 || ny < 10) return null
                  val colCnt = IntArray(nx)
                  val rowCnt = IntArray(ny)
                  for (ky in 0 until ny) {
                      val y = y0 + ky * step
                      for (kx in 0 until nx) {
                          val x = kx * step
                          if (!bright(x, y)) continue
                          val d = abs(f.r(x, y) - ref.r(x, y)) + abs(f.g(x, y) - ref.g(x, y)) + abs(f.b(x, y) - ref.b(x, y))
                          if (d < 90) continue
                          colCnt[kx]++
                          rowCnt[ky]++
                      }
                  }
                  val gap = max(4, (12 * s / step).roundToInt())
                  val len = max(4, (30 * s / step).roundToInt())
                  val c = bestSeg(colCnt, segments(colCnt, 2, gap, len)) ?: return null
                  val r = bestSeg(rowCnt, segments(rowCnt, 3, gap, len)) ?: return null
                  val wpx = (c[1] - c[0] + 1) * step
                  val hpx = (r[1] - r[0] + 1) * step
                  val ew = p.w * P * s
                  val eh = p.h * P * s
                  if (wpx < 0.45 * ew || wpx > 1.5 * ew || hpx < 0.45 * eh || hpx > 1.5 * eh) return null
                  val acx = (c[0] + c[1]) / 2.0 * step
                  val acy = y0 + (r[0] + r[1]) / 2.0 * step
                  val tcx = (cx(m.c) + cx(m.c + p.w - 1)) / 2.0
                  val tcy = (cy(m.r) + cy(m.r + p.h - 1)) / 2.0
                  val ex = tcx - acx
                  val ey = tcy - acy
                  if (abs(ex) > 500 * s || abs(ey) > 500 * s) return null
                  return doubleArrayOf(ex, ey)
              }

              fun analyze(frame: Frame): Reading? {
                  f = frame
                  s = frame.w / 1080.0
                  quality()
                  if (qCount < 60) {
                      if (!fit()) return null
                  }
                  val board = IntArray(8)
                  val rad = (8 * s).roundToInt()
                  for (r in 0..7) {
                      for (c in 0..7) {
                          if (filled(avg(cx(c), cy(r), rad))) board[r] = board[r] or (1 shl c)
                      }
                  }
                  val pieces = ArrayList<Piece>()
                  for (i in 0..2) {
                      val p = readPiece(i)
                      if (p != null) pieces.add(p)
                  }
                  return Reading(board, pieces)
              }
          }
          BLOK_EOF
          mkdir -p app/src/main/java/com/blok/yardimci
          cat > app/src/main/java/com/blok/yardimci/AutoTapService.kt <<'BLOK_EOF'
          package com.blok.yardimci

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.os.Handler
          import android.view.accessibility.AccessibilityEvent

          /** Parçayı tepsiden alıp tahtaya sürükleyen dokunma servisi (Erişilebilirlik izni ister). */
          class AutoTapService : AccessibilityService() {
              companion object {
                  @Volatile
                  var instance: AutoTapService? = null
              }

              override fun onServiceConnected() {
                  instance = this
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  instance = null
                  super.onDestroy()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              fun drag(x1: Float, y1: Float, x2: Float, y2: Float, dur: Long, done: (Boolean) -> Unit) {
                  val path = Path()
                  path.moveTo(x1, y1)
                  path.lineTo(x2, y2)
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0L, dur))
                      .build()
                  val ok = dispatchGesture(gesture, object : AccessibilityService.GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) {
                          done(true)
                      }

                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          done(false)
                      }
                  }, null)
                  if (!ok) done(false)
              }

              private fun seg(
                  prev: GestureDescription.StrokeDescription?,
                  fx: Float, fy: Float, tx: Float, ty: Float,
                  dur: Long, more: Boolean, worker: Handler,
                  onOk: () -> Unit, onFail: () -> Unit
              ): GestureDescription.StrokeDescription {
                  val path = Path()
                  path.moveTo(fx, fy)
                  if (Math.abs(tx - fx) + Math.abs(ty - fy) >= 1f) path.lineTo(tx, ty)
                  val st = if (prev == null) {
                      GestureDescription.StrokeDescription(path, 0L, dur, more)
                  } else {
                      prev.continueStroke(path, 0L, dur, more)
                  }
                  val g = GestureDescription.Builder().addStroke(st).build()
                  val ok = dispatchGesture(g, object : AccessibilityService.GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) {
                          onOk()
                      }

                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          onFail()
                      }
                  }, worker)
                  if (!ok) onFail()
                  return st
              }

              /**
               * Görüntü referanslı sürükleme: parçayı tutar, hedefe yaklaştırır ve parmağı KALDIRMADAN bekler.
               * measure() ekran görüntüsünden kalkmış parçanın gerçek yerini ölçüp hedefe olan farkı [ex, ey] verir,
               * parmak o kadar kaydırılır (en çok 2 düzeltme). Sonra bırakılır.
               * Böylece blok parmağın üstüne kayma gibi oyun davranışları yerleşimi bozmaz.
               */
              fun dragRef(
                  x1: Float, y1: Float, x2: Float, y2: Float,
                  worker: Handler, tol: Float, maxX: Float, maxY: Float,
                  measure: () -> FloatArray?, done: (Boolean) -> Unit
              ) {
                  var st: GestureDescription.StrokeDescription? = null
                  var cx = x2
                  var cy = y2
                  fun finish() {
                      st = seg(st, cx, cy, cx, cy, 80L, false, worker, { done(true) }, { done(false) })
                  }
                  fun refine(n: Int) {
                      worker.postDelayed({
                          val e = try { measure() } catch (t: Throwable) { null }
                          if (e == null || n >= 2 || Math.abs(e[0]) + Math.abs(e[1]) < tol) {
                              finish()
                          } else {
                              val nx = (cx + e[0]).coerceIn(1f, maxX)
                              val ny = (cy + e[1]).coerceIn(1f, maxY)
                              st = seg(st, cx, cy, nx, ny, 220L, true, worker, { refine(n + 1) }, { done(false) })
                              cx = nx
                              cy = ny
                          }
                      }, 300L)
                  }
                  st = seg(null, x1, y1, x2, y2, 450L, true, worker, { refine(0) }, { done(false) })
              }
          }
          BLOK_EOF
          mkdir -p app/src/main/java/com/blok/yardimci
          cat > app/src/main/java/com/blok/yardimci/CaptureService.kt <<'BLOK_EOF'
          package com.blok.yardimci

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock
          import android.util.DisplayMetrics
          import android.view.Gravity
          import android.view.WindowManager
          import java.nio.ByteBuffer

          class CaptureService : Service() {
              private class Pending(val move: Move, val before: IntArray)

              private var projection: MediaProjection? = null
              private var reader: ImageReader? = null
              private var vd: VirtualDisplay? = null
              private var overlay: OverlayView? = null
              private var wm: WindowManager? = null

              private val thread = HandlerThread("blok-capture")
              private lateinit var handler: Handler
              private val ui = Handler(Looper.getMainLooper())
              private val analyzer = Analyzer()

              @Volatile private var running = false
              @Volatile private var busyUntil = 0L
              @Volatile private var dirty = true
              @Volatile private var stable = 0
              @Volatile private var corr = ""

              // Son değişen kare (ekran durağanlaşınca bunun üzerinde analiz yapılır)
              private var stored: ByteArray? = null
              private var sRs = 0
              private var sPs = 4
              private var sW = 0
              private var sH = 0
              private var lastHash = 0L
              private var lastAnalysis = 0L
              private var overlayEmpty = true

              // Otomatik oynama
              private var auto = false
              private var offX = 0.0
              private var offY = 0.0
              private var candIdx = 0
              private var fails = 0
              private var pending: Pending? = null
              private var autoNote = ""
              private val offs = doubleArrayOf(0.0, -140.0, -280.0, 140.0, -420.0, -70.0)

              private val tick = object : Runnable {
                  override fun run() {
                      if (!running) return
                      try {
                          step()
                      } catch (e: Throwable) {
                          // Tek kare hatası servisi durdurmasın
                      }
                      handler.postDelayed(this, 150)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP") {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (running) return START_NOT_STICKY
                  startForegroundCompat()

                  val code = intent?.getIntExtra("code", 0) ?: 0
                  auto = intent?.getBooleanExtra("auto", false) ?: false
                  @Suppress("DEPRECATION")
                  val data = intent?.getParcelableExtra<Intent>("data")
                  if (data == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  val prefs = getSharedPreferences("cal", Context.MODE_PRIVATE)
                  offX = prefs.getFloat("offX", 0f).toDouble()
                  offY = prefs.getFloat("offY", 0f).toDouble()

                  thread.start()
                  handler = Handler(thread.looper)

                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val proj = mpm.getMediaProjection(code, data)
                  projection = proj
                  proj.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          ui.post { stopSelf() }
                      }
                  }, handler)

                  val windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  wm = windowManager
                  val dm = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  windowManager.defaultDisplay.getRealMetrics(dm)
                  val w = dm.widthPixels
                  val h = dm.heightPixels

                  val ir = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                  reader = ir
                  vd = proj.createVirtualDisplay(
                      "blok-cap", w, h, dm.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      ir.surface, null, handler
                  )

                  val ov = OverlayView(this)
                  overlay = ov
                  val lp = WindowManager.LayoutParams(
                      w, h,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = 0
                  lp.y = 0
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  windowManager.addView(ov, lp)

                  running = true
                  handler.postDelayed(tick, 500)
                  return START_NOT_STICKY
              }

              /**
               * Her 150 ms'de yeni kare varsa seyrek örneklerle özet çıkarır (çok ucuz).
               * Ekran değiştiyse kareyi saklar, durağanlaşınca (2 ölçüm aynı) tam analizi bir kez çalıştırır.
               */
              private fun step() {
                  val now = SystemClock.uptimeMillis()
                  if (now < busyUntil) return
                  val r = reader ?: return
                  val img = r.acquireLatestImage()
                  if (img != null) {
                      try {
                          val plane = img.planes[0]
                          val buf = plane.buffer
                          val fr = Frame(buf, plane.rowStride, plane.pixelStride, img.width, img.height)
                          val hsh = analyzer.quickHash(fr)
                          if (hsh != lastHash || stored == null) {
                              lastHash = hsh
                              stable = 0
                              dirty = true
                              buf.rewind()
                              val n = buf.remaining()
                              var arr = stored
                              if (arr == null || arr.size < n) {
                                  arr = ByteArray(n)
                                  stored = arr
                              }
                              buf.get(arr, 0, n)
                              sRs = plane.rowStride
                              sPs = plane.pixelStride
                              sW = img.width
                              sH = img.height
                          } else {
                              stable++
                          }
                      } finally {
                          img.close()
                      }
                  } else {
                      stable++
                  }
                  if (!dirty) return
                  if (stable < 2 && now - lastAnalysis < 1200) return
                  val arr = stored ?: return
                  dirty = false
                  lastAnalysis = now
                  process(Frame(ByteBuffer.wrap(arr), sRs, sPs, sW, sH))
              }

              private fun process(frame: Frame) {
                  val rd = analyzer.analyze(frame)
                  if (rd == null) {
                      pending = null
                      if (!overlayEmpty) {
                          overlayEmpty = true
                          ui.post { overlay?.update(emptyList(), 0.0, 0.0, 1.0, "") }
                      }
                      return
                  }

                  // Önceki otomatik hamlenin sonucunu değerlendir
                  val pa = pending
                  if (pa != null) {
                      pending = null
                      if (!sameBoard(rd.board, pa.before)) {
                          fails = 0
                          calibrate(pa, rd.board)
                      } else {
                          fails++
                          if (fails >= 6) {
                              auto = false
                              autoNote = "OTO durdu: parca tasinmadi"
                          } else {
                              candIdx++
                              offY = offs[candIdx % offs.size]
                          }
                      }
                  }

                  val moves: List<Move> = if (rd.pieces.isEmpty()) emptyList() else Solver.solve(rd.board, rd.pieces)
                  val dx = analyzer.dx
                  val dy = analyzer.dy
                  val s = analyzer.s
                  overlayEmpty = false
                  val shapes = if (rd.pieces.isEmpty()) {
                      "parca yok"
                  } else {
                      rd.pieces.joinToString("  ") { (it.idx + 1).toString() + ":" + it.rows.joinToString(",") }
                  }
                  val oto = if (autoNote.isNotEmpty()) {
                      " | " + autoNote
                  } else if (auto) {
                      " | OTO oy=" + offY.toInt().toString() + (if (corr.isNotEmpty()) " " + corr else "")
                  } else {
                      ""
                  }
                  val info = "S8 dy=" + dy.toInt().toString() + " | " + shapes + oto
                  ui.post { overlay?.update(moves, dx, dy, s, info) }

                  if (auto && moves.isNotEmpty()) act(moves[0], rd)
              }

              private fun act(m: Move, rd: Reading) {
                  val svc = AutoTapService.instance
                  if (svc == null) {
                      autoNote = "OTO: erisilebilirlik izni kapali"
                      return
                  }
                  autoNote = ""
                  val p = m.p
                  val s = analyzer.s
                  val tx = ((Analyzer.CX0 + analyzer.dx + Analyzer.P * (m.c + p.gj) + offX) * s).toFloat()
                  val ty = ((Analyzer.CY0 + analyzer.dy + Analyzer.P * (m.r + p.gi) + offY) * s).toFloat()
                  // Sürükleme öncesi kare: kalkmış parçayı bulmak için referans
                  val arr = stored
                  val ref = if (arr != null) Frame(ByteBuffer.wrap(arr), sRs, sPs, sW, sH) else null
                  pending = Pending(m, rd.board.copyOf())
                  busyUntil = SystemClock.uptimeMillis() + 9000
                  val tol = (0.1 * Analyzer.P * s).toFloat()
                  svc.dragRef(
                      p.gx.toFloat(), p.gy.toFloat(), tx, ty,
                      handler, tol, (sW - 1).toFloat(), (sH - 1).toFloat(),
                      { if (ref == null) null else measureLifted(ref, m) },
                      { _ ->
                          busyUntil = SystemClock.uptimeMillis() + 900
                          stable = 0
                          dirty = true
                      }
                  )
              }

              /** Parmak basılıyken anlık ekran görüntüsünden parçanın hedefe uzaklığını (px) ölçer. */
              private fun measureLifted(ref: Frame, m: Move): FloatArray? {
                  val rdr = reader ?: return null
                  val img = rdr.acquireLatestImage()
                  if (img == null) {
                      corr = "olcum yok"
                      return null
                  }
                  try {
                      val pl = img.planes[0]
                      val fr = Frame(pl.buffer, pl.rowStride, pl.pixelStride, img.width, img.height)
                      val e = analyzer.liftedError(fr, ref, m.p, m)
                      if (e == null) {
                          corr = "parca bulunamadi"
                          return null
                      }
                      corr = "duz=" + e[0].toInt().toString() + "," + e[1].toInt().toString()
                      return floatArrayOf(e[0].toFloat(), e[1].toFloat())
                  } finally {
                      img.close()
                  }
              }

              private fun sameBoard(a: IntArray, b: IntArray): Boolean {
                  for (i in 0 until 8) {
                      if (a[i] != b[i]) return false
                  }
                  return true
              }

              /**
               * Hamle sonrası tahtadan parçanın gerçekte nereye düştüğünü bulur ve
               * sürükleme ofsetini buna göre düzeltir (parmağa göre yükselme gibi oyun davranışları için).
               */
              private fun calibrate(pa: Pending, after: IntArray) {
                  val p = pa.move.p
                  var found = 0
                  var fr = 0
                  var fc = 0
                  for (r in 0..(8 - p.h)) {
                      for (c in 0..(8 - p.w)) {
                          var ok = true
                          for (i in 0 until p.h) {
                              if ((pa.before[r + i] and (p.rows[i] shl c)) != 0) {
                                  ok = false
                                  break
                              }
                          }
                          if (!ok) continue
                          val nb = pa.before.copyOf()
                          for (i in 0 until p.h) nb[r + i] = nb[r + i] or (p.rows[i] shl c)
                          Solver.clr(nb)
                          if (sameBoard(nb, after)) {
                              found++
                              fr = r
                              fc = c
                          }
                      }
                  }
                  if (found == 1) {
                      val dr = fr - pa.move.r
                      val dc = fc - pa.move.c
                      if (dr != 0 || dc != 0) {
                          offY -= dr * Analyzer.P
                          offX -= dc * Analyzer.P
                      }
                      getSharedPreferences("cal", Context.MODE_PRIVATE).edit()
                          .putFloat("offX", offX.toFloat())
                          .putFloat("offY", offY.toFloat())
                          .apply()
                  }
              }

              private fun startForegroundCompat() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel("cap", "Blok Yardımcısı", NotificationManager.IMPORTANCE_LOW))
                  val stopPi = PendingIntent.getService(
                      this, 0,
                      Intent(this, CaptureService::class.java).setAction("STOP"),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  @Suppress("DEPRECATION")
                  val n = Notification.Builder(this, "cap")
                      .setContentTitle("Blok Yardımcısı çalışıyor")
                      .setContentText("Oyunu aç, öneriler ekranda görünür")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .addAction(Notification.Action.Builder(android.R.drawable.ic_delete, "Durdur", stopPi).build())
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, n)
                  }
              }

              override fun onDestroy() {
                  running = false
                  try { if (::handler.isInitialized) handler.removeCallbacksAndMessages(null) } catch (e: Throwable) {}
                  try { vd?.release() } catch (e: Throwable) {}
                  try { reader?.close() } catch (e: Throwable) {}
                  try { projection?.stop() } catch (e: Throwable) {}
                  try { overlay?.let { wm?.removeView(it) } } catch (e: Throwable) {}
                  try { thread.quitSafely() } catch (e: Throwable) {}
                  super.onDestroy()
              }
          }
