name: Blok APK 8

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK hazirla
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Proje dosyalarini olustur
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'BLOK_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.blok.yardimci"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.blok.yardimci6"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 8
                  versionName = "8"
              }

              signingConfigs {
                  create("fixed") {
                      storeFile = file("debug.keystore")
                      storeType = "pkcs12"
                      storePassword = "blokyardimci"
                      keyAlias = "blok"
                      keyPassword = "blokyardimci"
                  }
              }

              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("fixed")
                  }
                  getByName("release") {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          BLOK_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'BLOK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
